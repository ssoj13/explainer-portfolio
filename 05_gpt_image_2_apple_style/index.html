              <span className="meta-k">Local File Path</span>
              <span className="meta-v" title={meta.portrait_path || meta.local_path}>{meta.portrait_path || meta.local_path}</span>
            </div>
          </div>

          <div>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
              <span className="meta-k">Exact Generation Prompt (Reproducible)</span>
              <span className="meta-k">{meta.created_at}</span>
            </div>
            <div className="prompt-box">{meta.prompt}</div>
          </div>

          <div className="meta-actions">
            <button className="btn btn-sm" onClick={() => copyText(meta.prompt, "prompt")}>
              {copied === "prompt" ? "✓ Prompt Copied" : "📋 Copy Prompt"}
            </button>
            <button className="btn btn-sm" onClick={() => copyText(String(meta.seed_numeric || meta.seed), "seed")}>
              {copied === "seed" ? "✓ Seed Copied" : "🎲 Copy Seed"}
            </button>
            <button className="btn btn-sm" onClick={() => copyText(JSON.stringify(meta, null, 2), "json")}>
              {copied === "json" ? "✓ Metadata JSON Copied" : "{ } Copy Full Provenance JSON"}
            </button>
            {meta.source_grid_path && onOpenGrid && (
              <button className="btn btn-sm" onClick={() => onOpenGrid(meta.source_grid_path, `${itemLabel} — Full Uncropped 2x2 Master Grid (${meta.model})`)}>
                🖼️ View Full 2×2 Master Grid
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const manifest = window.__MANIFEST__;
  const [theme, setTheme] = useState("dark");
  const [activeStep, setActiveStep] = useState(1); // 1: Lead Hero, 2: Secondary Cast, 3: 6-Shot Storyboard, 4: Pipeline & JSON Export
  const [globalModelView, setGlobalModelView] = useState("gpt_image_2"); // "nano_banana_pro" | "gpt_image_2" | "runway_gen_4" | "compare_all"
  const [selection, setSelection] = useState(() => {
    try {
      const saved = localStorage.getItem("apol_studio_selection_v2");
      if (saved) return JSON.parse(saved);
    } catch (e) {}
    return window.__DEFAULT_SELECTION__;
  });
  const [perCardModel, setPerCardModel] = useState({});
  const [serverOnline, setServerOnline] = useState(false);
  const [lastSavedAt, setLastSavedAt] = useState(selection.updated_at || "");
  const [saveToast, setSaveToast] = useState("");
  const [lightbox, setLightbox] = useState(null); // { src, title, meta }
  const [groupFilter, setGroupFilter] = useState("ALL");

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
  }, [theme]);

  // Check if local Python Studio server is running and load latest selection from disk
  useEffect(() => {
    fetch("http://127.0.0.1:8765/api/selection")
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(data => {
        setServerOnline(true);
        if (data && data.lead_hero) {
          setSelection(data);
          setLastSavedAt(data.updated_at || "Synced with C:\\_apol\\production_selection.json");
        }
      })
      .catch(() => setServerOnline(false));
  }, []);

  // Persist every selection change to localStorage AND POST to C:\_apol\production_selection.json
  const persistSelection = (nextSel, toastMsg = "") => {
    const stamped = {
      ...nextSel,
      updated_at: new Date().toISOString()
    };
    setSelection(stamped);
    try {
      localStorage.setItem("apol_studio_selection_v2", JSON.stringify(stamped));
    } catch (e) {}

    fetch("http://127.0.0.1:8765/api/selection", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(stamped)
    })
      .then(r => r.json())
      .then(res => {
        if (res && res.ok) {
          setServerOnline(true);
          setLastSavedAt(res.updated_at);
          if (toastMsg) {
            setSaveToast(`${toastMsg} → Auto-saved to C:\\_apol\\production_selection.json`);
            setTimeout(() => setSaveToast(""), 2600);
          }
        }
      })
      .catch(() => {
        setServerOnline(false);
        if (toastMsg) {
          setSaveToast(`${toastMsg} (Saved in browser; click Export JSON for disk file)`);
          setTimeout(() => setSaveToast(""), 2600);
        }
      });
  };

  const getEffectiveModel = (cardKey) => {
    if (perCardModel[cardKey]) return perCardModel[cardKey];
    if (globalModelView === "compare_all") return "gpt_image_2";
    return globalModelView;
  };

  const selectLeadHero = (persona, modelId) => {
    const v = persona.variants[modelId];
    const next = {
      ...selection,
      lead_hero: {
        persona_id: persona.id,
        name: persona.name,
        age: persona.age,
        role: persona.role,
        preferred_model: modelId,
        model_identifier: v.model,
        seed: v.seed,
        job_or_task_id: v.job_or_task_id,
        portrait_path: v.portrait_path,
        source_grid_path: v.source_grid_path,
        prompt: v.prompt
      }
    };
    persistSelection(next, `Lead Hero set to #${persona.id} ${persona.name} (${v.model_badge})`);
  };

  const toggleSecondaryPersona = (persona, modelId) => {
    const exists = selection.secondary_cast.find(c => c.persona_id === persona.id);
    let nextCast;
    if (exists) {
      nextCast = selection.secondary_cast.filter(c => c.persona_id !== persona.id);
      persistSelection({ ...selection, secondary_cast: nextCast }, `Removed #${persona.id} ${persona.name} from Secondary Cast`);
    } else {
      const v = persona.variants[modelId];
      const defaultRole = persona.id === "05" ? SECONDARY_ROLES[0]
        : persona.id === "06" ? SECONDARY_ROLES[1]
        : (persona.id >= "09" && persona.id <= "12") ? SECONDARY_ROLES[2]
        : persona.id === "19" ? SECONDARY_ROLES[3]
        : persona.role;
      nextCast = [
        ...selection.secondary_cast,
        {
          persona_id: persona.id,
          name: persona.name,
          assigned_role: defaultRole,
          preferred_model: modelId,
          model_identifier: v.model,
          seed: v.seed,
          job_or_task_id: v.job_or_task_id,
          portrait_path: v.portrait_path
        }
      ];
      persistSelection({ ...selection, secondary_cast: nextCast }, `Added #${persona.id} ${persona.name} to Secondary Cast`);
    }
  };

  const updateSecondaryRole = (personaId, newRole) => {
    const nextCast = selection.secondary_cast.map(c =>
      c.persona_id === personaId ? { ...c, assigned_role: newRole } : c
    );
    persistSelection({ ...selection, secondary_cast: nextCast }, `Updated role for #${personaId}`);
  };

  const selectShotModel = (shot, modelId) => {
    const v = shot.variants[modelId];
    const currentShotSel = selection.shot_selections[shot.id] || {};
    const nextShots = {
      ...selection.shot_selections,
      [shot.id]: {
        ...currentShotSel,
        approved_model: modelId,
        model_identifier: v.model,
        seed: v.seed,
        job_or_task_id: v.job_or_task_id,
        keyframe_path: v.local_path,
        prompt: v.prompt
      }
    };
    setPerCardModel(prev => ({ ...prev, [shot.id]: modelId }));
    persistSelection({ ...selection, shot_selections: nextShots }, `Approved ${v.model_badge} for ${shot.id.toUpperCase()}`);
  };

  const applyModelToAllShots = (modelId) => {
    const nextShots = {};
    manifest.shots.forEach(s => {
      const v = s.variants[modelId];
      nextShots[s.id] = {
        ...(selection.shot_selections[s.id] || {}),
        approved_model: modelId,
        model_identifier: v.model,
        seed: v.seed,
        job_or_task_id: v.job_or_task_id,
        keyframe_path: v.local_path,
        prompt: v.prompt
      };
    });
    persistSelection({ ...selection, shot_selections: nextShots }, `Applied ${manifest.models[modelId].badge} to all 6 shots`);
  };

  const downloadSelectionJson = () => {
    const blob = new Blob([JSON.stringify(selection, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "production_selection.json";
    a.click();
    URL.revokeObjectURL(url);
    setSaveToast("Downloaded production_selection.json!");
    setTimeout(() => setSaveToast(""), 2500);
  };

  const groups = useMemo(() => {
    const set = new Set(manifest.personas.map(p => p.group));
    return ["ALL", ...Array.from(set)];
  }, [manifest]);

  const filteredPersonas = useMemo(() => {
    if (groupFilter === "ALL") return manifest.personas;
    return manifest.personas.filter(p => p.group === groupFilter);
  }, [manifest, groupFilter]);

  const leadHeroPersona = manifest.personas.find(p => p.id === selection.lead_hero?.persona_id) || manifest.personas[0];

  return (
    <div>
      {/* Sticky Frosted Header */}
      <header className="topbar">
        <div className="topbar-inner">
          <div className="brand">
            <div className="brand-logo"></div>
            <div>
              <div className="brand-title">Apple Studio Director’s Console — The 21 Empty Rows</div>
              <div className="brand-sub">3-Engine Neural Shootout (Nano Banana Pro • OpenAI GPT-Image-2 • Runway Gen-4) • Full Provenance &amp; JSON Sync</div>
            </div>
          </div>

          {/* Global Neural Engine Switcher */}
          <div className="segmented" title="Switch active AI generation model or compare all 3 side-by-side">
            <button
              className={`seg-btn ${globalModelView === "nano_banana_pro" ? "active" : ""}`}
              onClick={() => setGlobalModelView("nano_banana_pro")}
            >
              <span>🔵 Nano Banana Pro</span>
            </button>
            <button
              className={`seg-btn ${globalModelView === "gpt_image_2" ? "active" : ""}`}
              onClick={() => setGlobalModelView("gpt_image_2")}
            >
              <span>🟢 OpenAI GPT-Image-2</span>
            </button>
            <button
              className={`seg-btn ${globalModelView === "runway_gen_4" ? "active" : ""}`}
              onClick={() => setGlobalModelView("runway_gen_4")}
            >
              <span>🟣 Runway Gen-4</span>
            </button>
            <button
              className={`seg-btn ${globalModelView === "compare_all" ? "active" : ""}`}
              onClick={() => setGlobalModelView("compare_all")}
            >
              <span>⚡ Compare All 3 Models</span>
            </button>
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div className="status-pill" title={serverOnline ? "Connected to C:\\_apol\\studio_server.py — every click writes C:\\_apol\\production_selection.json" : "Opened via file:// — clicks save to localStorage and can be exported via Download JSON"}>
              <span className={`dot ${serverOnline ? "online" : "local"}`}></span>
              <span>{serverOnline ? "Live Sync: C:\\_apol\\production_selection.json" : "Local Mode (Export Ready)"}</span>
            </div>
            <button className="btn btn-sm" onClick={() => setTheme(theme === "dark" ? "light" : "dark")}>
              {theme === "dark" ? "☀️ Light Studio" : "🌙 Dark Studio"}
            </button>
          </div>
        </div>
      </header>

      {/* Main Content Container */}
      <main className="container">
        {/* Guided Interactive Director's Wizard Banner */}
        <section className="wizard-banner">
          <div style={{ maxWidth: 980 }}>
            <div className="wizard-steps">
              <button className={`step-chip ${activeStep === 1 ? "active" : "done"}`} onClick={() => setActiveStep(1)}>
                Step 1: Lead Hero (#01–#20) ✓ #{selection.lead_hero?.persona_id} {selection.lead_hero?.name}
              </button>
              <button className={`step-chip ${activeStep === 2 ? "active" : selection.secondary_cast.length > 0 ? "done" : ""}`} onClick={() => setActiveStep(2)}>
                Step 2: Secondary Cast ({selection.secondary_cast.length} selected)
              </button>
              <button className={`step-chip ${activeStep === 3 ? "active" : "done"}`} onClick={() => setActiveStep(3)}>
                Step 3: 6-Shot Storyboard &amp; Engine Lock
              </button>
              <button className={`step-chip ${activeStep === 4 ? "active" : ""}`} onClick={() => setActiveStep(4)}>
                Step 4: Video Pipeline &amp; JSON Output
              </button>
            </div>

            {activeStep === 1 && (
              <>
                <div className="wizard-question">Question 1 of 4: Who is our Lead Protagonist (Systems Architect), and which AI engine’s portrait do you prefer?</div>
                <div className="wizard-hint">
                  Click <b>“★ Select as Lead Hero”</b> on any of the 20 personas below, or switch between <b>Nano Banana Pro</b>, <b>GPT-Image-2</b>, and <b>Runway Gen-4</b> (or <b>Compare All 3 Models</b>). Expand <b>“⚙️ Generation Metadata &amp; Prompt”</b> beneath any card to inspect the exact seed, task ID, and prompt.
                </div>
              </>
            )}
            {activeStep === 2 && (
              <>
                <div className="wizard-question">Question 2 of 4: Which Secondary Characters should appear in the 30-second cut (Clerk in Loop, Bug Author, Surgical AI Avatar, SCE Inspector)?</div>
                <div className="wizard-hint">
                  Click <b>“+ Add Secondary Role”</b> on as many personas as you want and assign their narrative role from the dropdown. Your selection is saved immediately to <code>C:\_apol\production_selection.json</code>.
                </div>
              </>
            )}
            {activeStep === 3 && (
              <>
                <div className="wizard-question">Question 3 of 4: For each of the 6 Storyboard Shots (00:00–00:30), which AI engine’s keyframe should anchor the video render?</div>
                <div className="wizard-hint">
                  Compare <b>Nano Banana Pro</b> (Folder 04), <b>OpenAI GPT-Image-2</b> (Folder 05), and <b>Runway Gen-4</b> (Folder 06) per shot—or lock one engine across all 6 shots with one click.
                </div>
              </>
            )}
            {activeStep === 4 && (
              <>
                <div className="wizard-question">Question 4 of 4: Finalize Video Render Engine (Kling 4.0 vs Seedance 2.5), Voiceover Language, and Review JSON Payload</div>
                <div className="wizard-hint">
                  Everything you selected is structured below and automatically written to <code>C:\_apol\production_selection.json</code> so the AI agent can read it directly and launch the video render.
                </div>
              </>
            )}
          </div>

          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            {activeStep > 1 && (
              <button className="btn" onClick={() => setActiveStep(activeStep - 1)}>← Previous Step</button>
            )}
            {activeStep < 4 ? (
              <button className="btn btn-primary" onClick={() => setActiveStep(activeStep + 1)}>Next Question →</button>
            ) : (
              <button className="btn btn-emerald" onClick={downloadSelectionJson}>💾 Download production_selection.json</button>
            )}
          </div>
        </section>

        {/* STEP 1 & STEP 2: 20-Persona Casting Portfolio */}
        {(activeStep === 1 || activeStep === 2) && (
          <section>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12, marginBottom: 18 }}>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                {groups.map(g => (
                  <button
                    key={g}
                    className={`btn btn-sm ${groupFilter === g ? "btn-primary" : ""}`}
                    onClick={() => setGroupFilter(g)}
                  >
                    {g === "ALL" ? "All 20 Personas (#01–#20)" : g.split(":")[0]}
                  </button>
                ))}
              </div>
              <div style={{ fontSize: 13, color: "var(--text-secondary)" }}>
                Showing <b>{filteredPersonas.length}</b> personas • Click any portrait to open full-resolution lightbox
              </div>
            </div>

            <div className={`cast-grid ${globalModelView === "compare_all" ? "compare-mode" : ""}`}>
              {filteredPersonas.map(persona => {
                const cardKey = `persona_${persona.id}`;
                const activeModel = getEffectiveModel(cardKey);
                const variant = persona.variants[activeModel];
                const isLead = selection.lead_hero?.persona_id === persona.id;
                const secEntry = selection.secondary_cast.find(c => c.persona_id === persona.id);
                const isSecondary = Boolean(secEntry);

                return (
                  <div
                    key={persona.id}
                    className={`card ${isLead ? "selected-lead" : isSecondary ? "selected-secondary" : ""}`}
                  >
                    {/* Media Header: Single Model vs Side-by-Side 3-Model Strip */}
                    {globalModelView === "compare_all" ? (
                      <div className="compare-strip">
                        {["nano_banana_pro", "gpt_image_2", "runway_gen_4"].map(mid => {
                          const mv = persona.variants[mid];
                          const isPicked = activeModel === mid;
                          return (
                            <div
                              key={mid}
                              className={`compare-cell ${isPicked ? "active-variant" : ""}`}
                              onClick={() => setPerCardModel(prev => ({ ...prev, [cardKey]: mid }))}
                              onDoubleClick={() => setLightbox({ src: mv.portrait_path, title: `#${persona.id} ${persona.name} — ${mv.model_badge}`, meta: mv })}
                              title="Click to select this model variant; Double-click to zoom"
                            >
                              <img src={mv.portrait_path} alt={`${persona.name} ${mid}`} loading="lazy" />
                              <div className="compare-tag">
                                <span>{mv.model_badge.split(" ")[0]}</span>
                                <span
                                  style={{ cursor: "zoom-in", opacity: 0.85 }}
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    setLightbox({ src: mv.portrait_path, title: `#${persona.id} ${persona.name} — ${mv.model_badge}`, meta: mv });
                                  }}
                                >🔍</span>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    ) : (
                      <div className="card-media" onClick={() => setLightbox({ src: variant.portrait_path, title: `#${persona.id} ${persona.name} (${persona.age}) — ${variant.model_badge}`, meta: variant })}>
                        <img src={variant.portrait_path} alt={persona.name} loading="lazy" />
                        <div className="media-badges">
                          <span className="badge-id">#{persona.id}</span>
                          <span className={`badge-model ${activeModel}`}>{variant.model_badge}</span>
                        </div>
                      </div>
                    )}

                    <div className="card-body">
                      <div className="card-title-row">
                        <div className="card-title">#{persona.id} {persona.name} ({persona.age})</div>
                        {isLead && <span style={{ color: "var(--apple-blue)", fontSize: 12, fontWeight: 800 }}>★ LEAD HERO</span>}
                        {isSecondary && <span style={{ color: "var(--emerald)", fontSize: 12, fontWeight: 800 }}>✓ SECONDARY CAST</span>}
                      </div>
                      <div className="card-role">{persona.role}</div>
                      <div className="card-bio">{persona.bio}</div>

                      {/* Per-Card Neural Engine Selector */}
                      <div className="model-mini-pills">
                        {["nano_banana_pro", "gpt_image_2", "runway_gen_4"].map(mid => (
                          <button
                            key={mid}
                            className={`mini-pill ${activeModel === mid ? "active" : ""}`}
                            onClick={() => {
                              setPerCardModel(prev => ({ ...prev, [cardKey]: mid }));
                              if (isLead) selectLeadHero(persona, mid);
                            }}
                          >
                            {manifest.models[mid].badge}
                          </button>
                        ))}
                      </div>

                      {/* Selection Buttons */}
                      <div className="action-row">
                        <button
                          className={`btn btn-sm ${isLead ? "btn-primary" : ""}`}
                          onClick={() => selectLeadHero(persona, activeModel)}
                        >
                          {isLead ? `★ Lead Hero (${variant.model_badge})` : "★ Select as Lead Hero"}
                        </button>
                        <button
                          className={`btn btn-sm ${isSecondary ? "btn-emerald" : ""}`}
                          onClick={() => toggleSecondaryPersona(persona, activeModel)}
                        >
                          {isSecondary ? "✓ In Secondary Cast" : "+ Add Secondary Role"}
                        </button>
                      </div>

                      {isSecondary && (
                        <select
                          className="role-select"
                          value={secEntry.assigned_role}
                          onChange={(e) => updateSecondaryRole(persona.id, e.target.value)}
                        >
                          {SECONDARY_ROLES.map(r => (
                            <option key={r} value={r}>{r}</option>
                          ))}
                        </select>
                      )}
                    </div>

                    {/* Organic Collapsible Provenance & Prompt Card */}
                    <CollapsibleMetadata
                      meta={variant}
                      itemLabel={`#${persona.id} ${persona.name}`}
                      onOpenGrid={(gridPath, gridTitle) => setLightbox({ src: gridPath, title: gridTitle, meta: variant })}
                    />
                  </div>
                );
              })}
            </div>
          </section>
        )}

        {/* STEP 3: 6-Shot Storyboard Comparison & Keyframe Approval */}
        {activeStep === 3 && (
          <section>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12, marginBottom: 20 }}>
              <div>
                <h2 style={{ fontSize: 22, fontWeight: 700 }}>30-Second Apple Architectural Storyboard (6 Connected Shots × 5s)</h2>
                <p style={{ fontSize: 13.5, color: "var(--text-secondary)" }}>
                  Select the winning AI keyframe for each shot, or lock one model across the entire 30-second commercial.
                </p>
              </div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <button className="btn btn-sm" onClick={() => applyModelToAllShots("nano_banana_pro")}>
                  Lock All 6 Shots → Nano Banana Pro
                </button>
                <button className="btn btn-sm" onClick={() => applyModelToAllShots("gpt_image_2")}>
                  Lock All 6 Shots → OpenAI GPT-Image-2
                </button>
                <button className="btn btn-sm" onClick={() => applyModelToAllShots("runway_gen_4")}>
                  Lock All 6 Shots → Runway Gen-4
                </button>
              </div>
            </div>

            <div className={`shot-grid ${globalModelView === "compare_all" ? "compare-mode" : ""}`}>
              {manifest.shots.map(shot => {
                const shotSel = selection.shot_selections[shot.id] || {};
                const approvedModel = shotSel.approved_model || getEffectiveModel(shot.id);
                const variant = shot.variants[approvedModel];

                return (
                  <div key={shot.id} className="card selected-lead">
                    {globalModelView === "compare_all" ? (
                      <div className="compare-strip">
                        {["nano_banana_pro", "gpt_image_2", "runway_gen_4"].map(mid => {
                          const mv = shot.variants[mid];
                          const isPicked = approvedModel === mid;
                          return (
                            <div
                              key={mid}
                              className={`compare-cell ${isPicked ? "active-variant" : ""}`}
                              onClick={() => selectShotModel(shot, mid)}
                            >
                              <img src={mv.local_path} alt={`${shot.title} ${mid}`} loading="lazy" />
                              <div className="compare-tag">
                                <span>{isPicked ? "✓ APPROVED: " : ""}{mv.model_badge}</span>
                                <span
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    setLightbox({ src: mv.local_path, title: `Shot ${shot.num}: ${shot.title} — ${mv.model_badge}`, meta: mv });
                                  }}
                                >🔍 Zoom</span>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    ) : (
                      <div className="card-media" onClick={() => setLightbox({ src: variant.local_path, title: `Shot ${shot.num} (${shot.timecode}): ${shot.title} — ${variant.model_badge}`, meta: variant })}>
                        <img src={variant.local_path} alt={shot.title} loading="lazy" />
                        <div className="media-badges">
                          <span className="badge-id">SHOT {shot.num} • {shot.timecode}</span>
                          <span className={`badge-model ${approvedModel}`}>✓ Approved: {variant.model_badge}</span>
                        </div>
                      </div>
                    )}

                    <div className="card-body">
                      <div className="card-title-row">
                        <div className="card-title">Shot {shot.num} ({shot.timecode}) — {shot.title}</div>
                      </div>
                      <div className="card-bio">{shot.summary}</div>

                      <div className="action-row" style={{ alignItems: "center", justifyContent: "space-between" }}>
                        <div className="model-mini-pills">
                          {["nano_banana_pro", "gpt_image_2", "runway_gen_4"].map(mid => (
                            <button
                              key={mid}
                              className={`mini-pill ${approvedModel === mid ? "active" : ""}`}
                              onClick={() => selectShotModel(shot, mid)}
                            >
                              {approvedModel === mid ? "✓ " : ""}{manifest.models[mid].badge}
                            </button>
                          ))}
                        </div>
                        <button
                          className="btn btn-sm"
                          onClick={() => setLightbox({ src: variant.local_path, title: `Shot ${shot.num}: ${shot.title}`, meta: variant })}
                        >
                          🔍 Inspect 16:9 Keyframe
                        </button>
                      </div>
                    </div>

                    <CollapsibleMetadata meta={variant} itemLabel={`Shot ${shot.num}`} />
                  </div>
                );
              })}
            </div>
          </section>
        )}

        {/* STEP 4: Video Production Pipeline & Live JSON Inspector */}
        {activeStep === 4 && (
          <section>
            <h2 style={{ fontSize: 22, fontWeight: 700, marginBottom: 6 }}>Production Pipeline &amp; Machine-Readable Selection JSON</h2>
            <p style={{ fontSize: 13.5, color: "var(--text-secondary)", marginBottom: 16 }}>
              Configure the final video synthesis parameters below. Every change updates <code>C:\_apol\production_selection.json</code> in real time so your AI agent can immediately execute the render.
            </p>

            <div className="config-grid">
              <div className="config-card">
                <div className="card-title">1. Video I2V Engine &amp; Resolution</div>
                <label className="meta-k">Primary Video Generator</label>
                <select
                  className="input-field"
                  value={selection.production_pipeline.video_engine}
                  onChange={(e) => persistSelection({
                    ...selection,
                    production_pipeline: { ...selection.production_pipeline, video_engine: e.target.value }
                  }, "Updated Video Generator")}
                >
                  <option value="kling_4_0_pro_1080p">Kling 4.0 Pro (1080p Native Audio + Character Lock — ~$3.60 / 30s)</option>
                  <option value="seedance_2_5_draft_then_kling_1080p">Hybrid: Seedance 2.5 Draft (720p) → Kling 4.0 Master (1080p)</option>
                  <option value="runway_gen_4_turbo_i2v">Runway Gen-4 Turbo I2V (1920×1088 Native Reference Lock)</option>
                </select>

                <label className="meta-k">Voiceover &amp; Typography Locale</label>
                <select
                  className="input-field"
                  value={selection.production_pipeline.voiceover_language}
                  onChange={(e) => persistSelection({
                    ...selection,
                    production_pipeline: { ...selection.production_pipeline, voiceover_language: e.target.value }
                  }, "Updated Voiceover Language")}
                >
                  <option value="EN">English (Apple Keynote / Severance Documentary Tone)</option>
                  <option value="RU">Russian (Русская озвучка + английский системный HUD)</option>
                  <option value="MN">Mongolian (Монгол дуу оруулалт)</option>
                  <option value="INSTRUMENTAL">No Voiceover (Pure Sound Design + On-Screen Telemetry)</option>
                </select>

                <label className="meta-k">Director's Custom Notes for the AI Agent</label>
                <textarea
                  rows={4}
                  className="textarea-field"
                  value={selection.production_pipeline.director_notes}
                  onChange={(e) => persistSelection({
                    ...selection,
                    production_pipeline: { ...selection.production_pipeline, director_notes: e.target.value }
                  })}
                  placeholder="Add any specific instructions for face swapping, pacing, camera movement, or sound..."
                />
              </div>

              <div className="config-card">
                <div className="card-title">2. Selected Cast &amp; Keyframe Summary</div>
                <div style={{ display: "flex", gap: 14, alignItems: "center", padding: 12, background: "rgba(0,113,227,0.1)", borderRadius: 12, border: "1px solid var(--apple-blue)" }}>
                  <img
                    src={selection.lead_hero?.portrait_path}
                    alt="Lead"
                    style={{ width: 64, height: 64, borderRadius: 10, objectFit: "cover" }}
                  />
                  <div>
                    <div className="meta-k">Lead Hero Protagonist</div>
                    <div style={{ fontSize: 16, fontWeight: 700 }}>#{selection.lead_hero?.persona_id} {selection.lead_hero?.name} — {selection.lead_hero?.role}</div>
                    <div className="mono" style={{ fontSize: 11.5, color: "var(--text-secondary)" }}>
                      Model: {selection.lead_hero?.preferred_model} • Seed: {String(selection.lead_hero?.seed || "").split(" ")[0]}
                    </div>
                  </div>
                </div>

                <div className="meta-k" style={{ marginTop: 6 }}>Secondary Cast ({selection.secondary_cast.length})</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 190, overflowY: "auto" }}>
                  {selection.secondary_cast.map(c => (
                    <div key={c.persona_id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 10px", background: "rgba(255,255,255,0.04)", borderRadius: 8, fontSize: 12.5 }}>
                      <span><b>#{c.persona_id} {c.name}</b> ({c.preferred_model})</span>
                      <span style={{ color: "var(--emerald)", fontWeight: 600 }}>{c.assigned_role}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="config-card" style={{ marginTop: 20 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
                <div>
                  <div className="card-title">Live Output: <code>C:\_apol\production_selection.json</code></div>
                  <div style={{ fontSize: 12.5, color: "var(--text-secondary)" }}>
                    Last synced: {lastSavedAt || "Ready"} • Your AI assistant reads this exact file to assemble the video pipeline.
                  </div>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button className="btn btn-sm" onClick={() => navigator.clipboard.writeText(JSON.stringify(selection, null, 2))}>
                    📋 Copy JSON to Clipboard
                  </button>
                  <button className="btn btn-emerald btn-sm" onClick={downloadSelectionJson}>
                    💾 Save / Download production_selection.json
                  </button>
                </div>
              </div>
              <pre className="prompt-box" style={{ maxHeight: 380 }}>{JSON.stringify(selection, null, 2)}</pre>
            </div>
          </section>
        )}
      </main>

      {/* Sticky Bottom Director's Summary Dock */}
      <footer className="bottom-dock">
        <div className="dock-inner">
          <div className="dock-summary">
            <div className="dock-item">
              <img className="dock-avatar" src={selection.lead_hero?.portrait_path} alt="Lead" />
              <div>
                <div style={{ fontSize: 11, color: "var(--text-muted)", fontWeight: 700, textTransform: "uppercase" }}>Lead Hero</div>
                <div style={{ fontWeight: 700 }}>#{selection.lead_hero?.persona_id} {selection.lead_hero?.name} <span style={{ color: "var(--apple-blue)", fontSize: 11.5 }}>({selection.lead_hero?.preferred_model})</span></div>
              </div>
            </div>

            <div className="dock-item">
              <div>
                <div style={{ fontSize: 11, color: "var(--text-muted)", fontWeight: 700, textTransform: "uppercase" }}>Secondary Cast</div>
                <div style={{ fontWeight: 700 }}>
                  {selection.secondary_cast.length > 0
                    ? selection.secondary_cast.map(c => `#${c.persona_id} ${c.name}`).join(", ")
                    : "None selected"}
                </div>
              </div>
            </div>

            <div className="dock-item">
              <div>
                <div style={{ fontSize: 11, color: "var(--text-muted)", fontWeight: 700, textTransform: "uppercase" }}>6 Shots Approved</div>
                <div style={{ fontWeight: 700 }}>
                  {Object.entries(selection.shot_selections).map(([k, v]) => `${k.replace("shot_", "S")}:${v.approved_model.split("_")[0]}`).join(" • ")}
                </div>
              </div>
            </div>
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            {saveToast && (
              <span style={{ fontSize: 12.5, color: "var(--emerald)", fontWeight: 600 }}>{saveToast}</span>
            )}
            <button className="btn" onClick={() => setActiveStep(4)}>
              { } Inspect JSON
            </button>
            <button className="btn btn-emerald" onClick={() => {
              persistSelection({ ...selection, status: "APPROVED_BY_DIRECTOR" }, "✓ Approved & Locked!");
            }}>
              ✓ Lock Selection to C:\_apol\production_selection.json
            </button>
          </div>
        </div>
      </footer>

      {/* Lightbox Modal */}
      {lightbox && (
        <div className="modal-backdrop" onClick={() => setLightbox(null)}>
          <div className="modal-content" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <div style={{ fontWeight: 700, fontSize: 16 }}>{lightbox.title}</div>
              <button className="btn btn-sm" onClick={() => setLightbox(null)}>✕ Close (Esc)</button>
            </div>
            <div className="modal-body">
              <img src={lightbox.src} alt={lightbox.title} />
              {lightbox.meta && (
                <div style={{ width: "100%" }}>
                  <CollapsibleMetadata meta={lightbox.meta} itemLabel={lightbox.title} />
                </div>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
